[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "probe-core"
version = "0.3.0"
description = "A small persistent task workspace for cooperating agents."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13,<3.14"
dependencies = []

[project.optional-dependencies]
test = ["pytest==9.1.1"]
mcp = ["mcp==2.2.0"]
lint = ["ruff==0.16.8"]

[project.scripts]
probe-agent = "probe_core.agent_cli:main"
probe-mcp = "probe_core.agent_mcp:main"

[tool.setuptools.packages.find]
include = ["probe_core*"]

[tool.setuptools.package-data]
probe_core = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py313"
