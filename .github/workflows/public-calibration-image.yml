name: Build supervised public calibration image
on:
  push:
    branches: [feat/live-deployment]
    paths:
      - deploy/gpu/public-calibration.py
      - deploy/gpu/public-calibration-entrypoint.py
      - deploy/gpu/Dockerfile.public-calibration
      - .github/workflows/public-calibration-image.yml
  workflow_dispatch:
    inputs:
      worker_image:
        description: Verified worker image pinned by digest
        required: true
        type: string
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Check immutable parent
        env:
          WORKER_IMAGE: ${{ inputs.worker_image || 'ghcr.io/jaykobdetar/probe-mcp-worker@sha256:97a87f0ccf7baae5a77dd6dabaf1f7de1d476396449b40da4e96c8bef7140e41' }}
        run: |
          python3 - <<'PY'
          import os,re
          assert re.fullmatch(r'ghcr.io/jaykobdetar/probe-mcp-worker@sha256:[0-9a-f]{64}',os.environ['WORKER_IMAGE'])
          PY
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: deploy/gpu/Dockerfile.public-calibration
          platforms: linux/amd64
          push: true
          provenance: mode=max
          tags: ghcr.io/jaykobdetar/probe-mcp-worker:public-calibration-${{ github.sha }}
          build-args: |
            WORKER_IMAGE=${{ inputs.worker_image || 'ghcr.io/jaykobdetar/probe-mcp-worker@sha256:97a87f0ccf7baae5a77dd6dabaf1f7de1d476396449b40da4e96c8bef7140e41' }}
            SOURCE_COMMIT=${{ github.sha }}
      - name: Record image identity
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          PARENT: ${{ inputs.worker_image || 'ghcr.io/jaykobdetar/probe-mcp-worker@sha256:97a87f0ccf7baae5a77dd6dabaf1f7de1d476396449b40da4e96c8bef7140e41' }}
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          Path('image.json').write_text(json.dumps({'image':'ghcr.io/jaykobdetar/probe-mcp-worker','digest':os.environ['DIGEST'],'parent':os.environ['PARENT'],'entrypoint_source':os.environ['GITHUB_SHA'],'profile':'supervised_public_calibration','gpu_acceptance_passed':False},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: public-calibration-image
          path: image.json
