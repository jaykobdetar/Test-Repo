name: CPU-Quine
on:
  push:
    paths:
      - "cpu-quine/**"
      - ".github/workflows/cpu-quine.yml"
  pull_request:
    paths:
      - "cpu-quine/**"
      - ".github/workflows/cpu-quine.yml"
jobs:
  verification-ladder:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: cpu-quine
    steps:
      - uses: actions/checkout@v4
      - name: Install Yosys, Verilator and nextpnr
        run: sudo apt-get update && sudo apt-get install -y yosys verilator nextpnr-ecp5
      - name: Build and run the verification ladder (checks 1-8, 9 in simulation, 10)
        run: make -j4 check
      - name: ECP5 place and route meets 50 MHz at speed grade 8
        run: make fpga
      - name: ISA reference matches quine/arch.py
        run: |
          python3 -m quine.isadoc > /tmp/isa.md
          diff -u docs/isa.md /tmp/isa.md
