name: Verify Probe
on: [push, pull_request]
jobs:
  cpu-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.21"
          enable-cache: false
      - run: uv python install 3.13
      - run: uv sync --locked --all-extras
      - run: uv run --locked python -m pytest -q
      - run: uv build
